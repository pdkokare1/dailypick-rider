<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DailyPick Rider Terminal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; text-align: center; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        #status-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ef4444; margin-right: 8px; }
        .online { background: #10b981 !important; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2><span id="status-indicator"></span>Rider Terminal</h2>

    <div id="setup-view" class="card">
        <h3>Assign Delivery</h3>
        <p style="font-size: 14px; color: #94a3b8;">Enter the Order ID you are delivering to begin broadcasting your GPS.</p>
        <input type="text" id="order-id-input" placeholder="e.g., OMNI-12345 or 60d5f...">
        <button class="btn-primary" onclick="startDelivery()">Start Live Tracking</button>
    </div>

    <div id="active-view" class="card hidden">
        <h3 style="color: #10b981;">🟢 Live Broadcast Active</h3>
        <p style="font-size: 14px; color: #94a3b8;">Order: <strong id="display-order-id"></strong></p>
        <p style="font-size: 12px; color: #64748b;" id="gps-stats">Locating satellites...</p>
        
        <button class="btn-success" onclick="completeDelivery()">Mark Delivered</button>
        <button class="btn-danger" onclick="stopDelivery()">Abort Tracking</button>
    </div>

    <script>
        const WS_URL = 'wss://dailypick-backend-production-05d6.up.railway.app/api/ws/rider';
        let ws = null;
        let watchId = null;
        let activeOrderId = null;

        function connectWS() {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => document.getElementById('status-indicator').classList.add('online');
            ws.onclose = () => {
                document.getElementById('status-indicator').classList.remove('online');
                setTimeout(connectWS, 3000); // Auto-reconnect
            };
        }

        function startDelivery() {
            const input = document.getElementById('order-id-input').value.trim();
            if (!input) return alert("Enter an Order ID.");
            
            activeOrderId = input;
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('active-view').classList.remove('hidden');
            document.getElementById('display-order-id').textContent = activeOrderId;

            if ("geolocation" in navigator) {
                // High accuracy mode for Uber-style tracking
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const { latitude, longitude, heading, speed } = position.coords;
                        document.getElementById('gps-stats').textContent = `Lat: ${latitude.toFixed(4)} | Lng: ${longitude.toFixed(4)} | Speed: ${speed ? (speed * 3.6).toFixed(1) + ' km/h' : '0 km/h'}`;
                        
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                type: 'GPS_UPDATE',
                                orderId: activeOrderId,
                                lat: latitude,
                                lng: longitude,
                                heading: heading || 0
                            }));
                        }
                    },
                    (err) => alert("GPS Error: " + err.message),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                alert("Geolocation is not supported by this device.");
            }
        }

        function stopTracking() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            activeOrderId = null;
            document.getElementById('active-view').classList.add('hidden');
            document.getElementById('setup-view').classList.remove('hidden');
            document.getElementById('order-id-input').value = '';
        }

        function completeDelivery() {
            // In a full implementation, this hits the backend API to mark order as delivered
            alert("Delivery Complete! GPS Broadcast terminated.");
            stopTracking();
        }

        function stopDelivery() {
            stopTracking();
        }

        connectWS();
    </script>
</body>
</html>
